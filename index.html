<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Update SlimeNRF tracker and receiver firmware using WebHID or Web Serial.">
  <meta name="color-scheme" content="dark light">
  <title>SlimeNRF OTA Updater</title>

  <!-- Tailwind CSS + DaisyUI (local, via Vite plugin) -->
  <link rel="stylesheet" href="./styles.css">

  <!-- App entry point -->
  <script type="module" src="./js/app.js"></script>

  <style>
    /* Prevent flash of unstyled Alpine template content */
    [x-data] { visibility: visible; }
  </style>
</head>

<body class="min-h-screen bg-base-200 text-base-content">
<div x-data="otaApp" class="min-h-screen flex flex-col">

  <!-- ═══════════════════════════════════════════════════════════════
       Navbar
       ═══════════════════════════════════════════════════════════════ -->
  <nav class="navbar bg-base-100 shadow-md">
    <div class="container mx-auto max-w-7xl px-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-7 h-7 text-primary shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        <span class="text-lg font-bold tracking-tight leading-none" x-text="$t('title')"></span>
      </div>
      <div class="flex-none gap-2 flex items-center">
        <!-- Language switcher -->
        <button class="btn btn-ghost btn-sm font-medium text-xs px-2"
                @click="$store.i18n.nextLocale()"
                x-text="$store.i18n.localeNames[$store.i18n.locale]"></button>
        <!-- Theme toggle -->
        <label class="swap swap-rotate btn btn-ghost btn-circle btn-sm">
          <input type="checkbox" :checked="theme === 'light'" @change="toggleTheme()">
          <svg class="swap-off w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
          <svg class="swap-on w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zm11.394-5.834a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zm5.834-1.166a.75.75 0 00-1.06 1.06l1.59 1.591a.75.75 0 101.061-1.06l-1.59-1.591zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zm.166 5.834a.75.75 0 001.06 1.06l1.591-1.59a.75.75 0 10-1.06-1.06l-1.591 1.59zM12 7.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9z"/></svg>
        </label>
      </div>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════════════════════
       Main content
       ═══════════════════════════════════════════════════════════════ -->
  <main class="flex-1 container mx-auto max-w-7xl p-4 space-y-4">

    <!-- Browser capability notice -->
    <template x-if="!webHIDSupported && !webSerialSupported">
      <div class="alert alert-warning shadow-lg">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <div>
          <p class="font-semibold" x-text="$t('webhid.notSupported')"></p>
          <p class="text-sm" x-html="$t('webhid.useChrome', { chrome: '<b>Chrome</b>', edge: '<b>Edge</b>', opera: '<b>Opera</b>' })"></p>
        </div>
      </div>
    </template>
    <template x-if="!webHIDSupported && webSerialSupported">
      <div class="alert alert-info shadow-lg">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <div>
          <p class="font-semibold" x-text="$t('webhid.notSupported')"></p>
          <p class="text-sm" x-text="$t('webhid.serialAvailable')"></p>
        </div>
      </div>
    </template>


    <!-- ─── Connection Card ────────────────────────────────────── -->
    <div class="card bg-base-100 shadow-md" x-show="webHIDSupported">
      <div class="card-body p-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 class="card-title text-base">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <span x-text="$t('conn.title')"></span>
          </h2>
          <div class="flex flex-wrap items-center gap-2">
            <template x-if="connected">
              <div class="flex items-center gap-3">
                <div class="flex items-center gap-2">
                  <span class="badge badge-success badge-xs"></span>
                  <span class="text-sm font-medium" x-text="deviceLabel(selectedDevice)"></span>
                </div>
                <button class="btn btn-ghost btn-sm" @click="scan()" :disabled="scanning || updating">
                  <span class="loading loading-spinner loading-xs" x-show="scanning"></span>
                  <span x-text="$t('conn.rescan')"></span>
                </button>
                <button class="btn btn-ghost btn-sm text-error" @click="disconnect()" :disabled="updating" x-text="$t('conn.disconnect')">
                </button>
              </div>
            </template>
            <template x-if="!connected">
              <div class="flex items-center gap-2">
                <span class="loading loading-spinner loading-xs" x-show="connecting"></span>
                <button class="btn btn-primary btn-sm" @click="addDevice()" :disabled="connecting">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                  <span x-text="$t('conn.addDevice')"></span>
                </button>
              </div>
            </template>
          </div>
        </div>

        <!-- Paired devices list (when not connected) -->
        <template x-if="!connected && pairedDevices.length > 0">
          <div class="mt-2 space-y-1">
            <div class="text-xs text-base-content/60 mb-1" x-text="$t('conn.pairedDevices')"></div>
            <template x-for="(dev, idx) in pairedDevices" :key="idx">
              <button class="btn btn-ghost btn-sm w-full justify-start gap-2 font-normal"
                      @click="connectDevice(dev)" :disabled="connecting">
                <svg class="w-4 h-4 text-base-content/40 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <span class="truncate" x-text="deviceLabel(dev)"></span>
                <template x-if="getReceiverCache(dev)">
                  <span class="badge badge-ghost badge-xs shrink-0" x-text="getReceiverCache(dev).trackerCount + ' ' + $t('conn.trackers')"></span>
                </template>
              </button>
            </template>
          </div>
        </template>

        <!-- Switch device (when connected with multiple paired) -->
        <template x-if="connected && pairedDevices.length > 1">
          <div class="mt-2">
            <details class="collapse collapse-arrow bg-base-200/50 rounded-lg">
              <summary class="collapse-title text-xs min-h-0 py-1 px-3" x-text="$t('conn.switchReceiver', { count: pairedDevices.length })"></summary>
              <div class="collapse-content px-3 pb-2 space-y-1">
                <template x-for="(dev, idx) in pairedDevices" :key="idx">
                  <button class="btn btn-ghost btn-xs w-full justify-start gap-2 font-normal"
                          @click="connectDevice(dev)" :disabled="connecting || updating"
                          :class="{ 'btn-active': selectedDevice === dev }">
                    <span class="truncate" x-text="deviceLabel(dev)"></span>
                    <template x-if="getReceiverCache(dev)">
                    <span class="badge badge-ghost badge-xs shrink-0" x-text="getReceiverCache(dev).trackerCount + ' ' + $t('conn.trackers')"></span>
                    </template>
                  </button>
                </template>
              </div>
            </details>
          </div>
        </template>
      </div>
    </div>

    <!-- ─── OTA Prerequisite Notice ──────────────────────────────── -->
    <div class="alert alert-info shadow-sm text-sm" x-show="!otaNoticeHidden">
      <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <div>
        <p x-html="$t('notice.otaRequires', { link: '<a href=\'https://github.com/jitingcn/SlimeVR-Tracker-nRF/releases/tag/260528\' target=\'_blank\' class=\'link font-semibold\'>260528</a>', both: '<b>' + $t('notice.both') + '</b>' })"></p>
      </div>
      <button class="btn btn-ghost btn-xs btn-circle shrink-0" @click="otaNoticeHidden = true" title="Dismiss">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- ─── Compact Receiver Info Card ─────────────────────────── -->
    <div class="card bg-base-100 shadow-md" x-cloak x-show="connected">
      <div class="card-body p-3">
        <div class="flex flex-wrap items-center gap-3">
          <!-- Receiver label -->
          <div class="flex items-center gap-2 shrink-0">
            <svg class="w-5 h-5 opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2"/></svg>
            <span class="font-semibold text-sm" x-text="$t('receiver.title')"></span>
          </div>

          <!-- Info chips (shown when queried, with or without self-OTA support) -->
          <template x-if="receiverInfo">
            <div class="flex flex-wrap items-center gap-1.5 flex-1 min-w-0">
              <span class="badge badge-ghost badge-sm font-mono" x-text="'v' + receiverInfo.version"></span>
              <span class="badge badge-ghost badge-sm font-mono text-xs" x-text="receiverInfo.boardTarget"></span>
              <span class="badge badge-ghost badge-sm text-xs" x-text="(receiverInfo.firmwareSize / 1024).toFixed(0) + ' KB'"></span>
              <span class="badge badge-ghost badge-sm text-xs opacity-60" x-text="receiverInfo.buildDate"></span>
              <template x-if="receiverInfo.protocolVersion === 0">
                <span class="badge badge-warning badge-xs gap-0.5">
                  <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  <span x-text="$t('receiver.selfOtaUnsupported')"></span>
                </span>
              </template>
            </div>
          </template>

          <!-- No response at all (old firmware or timing issue) -->
          <template x-if="!receiverInfo && receiverInfoQueried && !queryingReceiver">
            <span class="flex items-center gap-1.5 flex-1">
              <span class="badge badge-ghost badge-xs gap-0.5">
                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span x-text="$t('receiver.noResponse')"></span>
              </span>
              <span class="text-[10px] opacity-40" x-text="$t('receiver.noResponseHint')"></span>
            </span>
          </template>

          <!-- Querying spinner -->
          <template x-if="queryingReceiver">
            <span class="flex items-center gap-1.5 text-xs opacity-60 flex-1">
              <span class="loading loading-spinner loading-xs"></span> <span x-text="$t('receiver.querying')"></span>
            </span>
          </template>

          <!-- Not yet queried (should auto-query, but show as fallback) -->
          <template x-if="!receiverInfo && !receiverInfoQueried && !queryingReceiver">
            <span class="text-xs opacity-40 flex-1" x-text="$t('receiver.querying')"></span>
          </template>

          <!-- Actions -->
          <div class="flex items-center gap-1.5 shrink-0">
            <!-- DFU button for nrf5_opendfu receivers (e.g. HolyIoT) -->
            <template x-if="receiverInfo && receiverInfo.bootloader === 'nrf5_opendfu'">
              <button class="btn btn-ghost btn-xs gap-1 text-warning"
                      :disabled="enteringDfu"
                      :title="$t('receiver.enterDfuTitle')"
                      @click="enterReceiverDfu()">
                <span class="loading loading-spinner loading-xs" x-show="enteringDfu"></span>
                <svg x-show="!enteringDfu" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                <span x-text="$t('receiver.enterDfu')"></span>
              </button>
            </template>
            <button class="btn btn-ghost btn-xs gap-1"
                    :disabled="queryingReceiver || receiverUpdating"
                    @click="queryReceiverInfo()">
              <svg class="w-3.5 h-3.5" x-show="!queryingReceiver" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              <span x-text="$t('receiver.refresh')"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 shadow-md" x-cloak x-show="connected && Object.keys(trackers).length > 0">
      <div class="card-body p-4">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <h2 class="card-title text-base">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <span x-text="$t('tracker.title')"></span>
            <span class="badge badge-neutral badge-sm" x-text="onlineTrackerIds.length + ' ' + $t('tracker.online')"></span>
          </h2>
          <div class="flex gap-2" x-show="!updating">
            <button class="btn btn-ghost btn-xs" @click="selectAllOnline()" x-text="$t('tracker.selectAll')"></button>
            <button class="btn btn-ghost btn-xs" @click="deselectAll()" x-text="$t('tracker.deselect')"></button>
          </div>
        </div>

        <!-- Tracker cards grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2">
          <template x-for="tid in allTrackerIds" :key="tid">
            <div class="card bg-base-200 border cursor-pointer transition-all duration-300 hover:shadow-md"
                 :class="[
                   selectedTrackers[tid]
                     ? 'border-primary ring-2 ring-primary/30 bg-primary/5'
                     : 'border-base-300',
                   !trackers[tid]?.online ? 'opacity-40' : '',
                   trackers[tid]?.online ? tpsGlowClass(tid) : '',
                 ]"
                 @click="canSelectTracker(tid) && !updating && toggleTracker(tid)">
              <div class="card-body p-3 gap-1">
                <!-- Header: checkbox + ID + TPS + refresh + status badge -->
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-1.5">
                    <input type="checkbox" class="checkbox checkbox-xs checkbox-primary"
                           :checked="!!selectedTrackers[tid]"
                           :disabled="!canSelectTracker(tid) || updating"
                           @click.stop="canSelectTracker(tid) && !updating && toggleTracker(tid)">
                    <span class="font-mono font-bold text-sm">T<span x-text="tid"></span></span>
                    <!-- TPS badge -->
                    <template x-if="trackers[tid]?.online && trackerTps[tid] > 0">
                      <span class="badge badge-xs font-mono"
                            :class="{
                              'badge-success': trackerTps[tid] >= 75,
                              'badge-info': trackerTps[tid] >= 25 && trackerTps[tid] < 75,
                              'badge-ghost': trackerTps[tid] < 25,
                            }"
                            x-text="trackerTps[tid] + ' tps'"></span>
                    </template>
                  </div>
                  <div class="flex items-center gap-1">
                    <!-- Refresh / Querying spinner (fixed 24x24 area to prevent layout shift) -->
                    <div class="w-6 h-6 flex items-center justify-center shrink-0">
                      <span class="loading loading-spinner loading-xs text-primary"
                            x-show="queryingTrackers[tid]"></span>
                      <button class="btn btn-ghost btn-circle btn-xs opacity-40 hover:opacity-100"
                              x-show="!updating && !queryingTrackers[tid]"
                              @click.stop="refreshTracker(tid)"
                              :title="$t('tracker.refreshInfo')">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                      </button>
                    </div>
                    <span class="badge badge-xs"
                          :class="trackers[tid]?.online ? 'badge-success' : 'badge-ghost'"
                          x-text="trackers[tid]?.online ? $t('tracker.online') : $t('tracker.offline')"></span>
                  </div>
                </div>

                <!-- Address (always show if available) -->
                <template x-if="trackers[tid]?.addr">
                  <div class="text-[10px] opacity-40 font-mono mt-1 truncate" x-text="trackers[tid].addr"></div>
                </template>

                <!-- Firmware info (if available) -->
                <template x-if="trackers[tid]?.info">
                  <div class="text-xs opacity-60 space-y-0.5">
                    <div class="flex justify-between">
                      <span x-text="'v' + trackers[tid].info.version"></span>
                      <span x-text="(trackers[tid].info.firmwareSize / 1024).toFixed(0) + ' KB'"></span>
                      <template x-if="trackers[tid].info.flashBase > 0">
                        <span class="font-mono" x-text="'0x' + trackers[tid].info.flashBase.toString(16).padStart(5, '0')"></span>
                      </template>
                    </div>
                    <div class="truncate" x-text="trackers[tid].info.boardTarget"></div>
                    <div class="opacity-50 text-[10px]" x-text="trackers[tid].info.buildDate"></div>
                  </div>
                </template>

                <!-- OTA not supported warning (queried but no info) -->
                <template x-if="trackers[tid]?.online && trackers[tid]?.infoQueried && !trackers[tid]?.info">
                  <div class="mt-1">
                    <span class="badge badge-warning badge-xs gap-1">
                      <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      <span x-text="$t('tracker.otaUnsupported')"></span>
                    </span>
                    <p class="text-[10px] opacity-40 mt-0.5" x-text="$t('tracker.flashFirst')"></p>
                  </div>
                </template>

                <!-- Update status during OTA -->
                <template x-if="updating && trackerStatuses[tid]">
                  <div class="mt-1">
                    <span class="badge badge-xs"
                          :class="{
                            'badge-info':    ['Ready','Receiving','Verifying','Activating'].includes(trackerStatuses[tid]),
                            'badge-success': trackerStatuses[tid] === 'Complete' || trackerStatuses[tid] === 'Verified',
                            'badge-error':   !['Ready','Receiving','Verifying','Activating','Complete','Verified'].includes(trackerStatuses[tid]),
                          }"
                          x-text="trackerStatuses[tid]"></span>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- Scanning indicator -->
        <div class="flex items-center justify-center gap-2 py-4" x-show="scanning">
          <span class="loading loading-dots loading-sm text-primary"></span>
          <span class="text-sm opacity-60" x-text="$t('tracker.scanning')"></span>
        </div>
      </div>
    </div>

    <!-- ─── GitHub Downloads Card ──────────────────────────────── -->
    <div class="card bg-base-100 shadow-md">
      <div class="card-body p-0">
        <button class="flex items-center justify-between w-full p-4 hover:bg-base-200/50 transition-colors"
                @click="ghToggle()">
          <h2 class="card-title text-base">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/></svg>
            <span x-text="$t('gh.title')"></span>
          </h2>
          <svg class="w-4 h-4 transition-transform" :class="ghExpanded ? 'rotate-180' : ''"
               fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <div x-show="ghExpanded" x-transition class="px-4 pb-4 space-y-3">

          <!-- Tabs + Filter toggle -->
          <div class="flex items-center gap-2">
            <div role="tablist" class="tabs tabs-border flex-1">
              <a role="tab" class="tab" :class="ghTab === 'releases' ? 'tab-active' : ''"
                 @click="ghSwitchTab('releases')" x-text="$t('gh.releases')"></a>
              <a role="tab" class="tab" :class="ghTab === 'ci' ? 'tab-active' : ''"
                 @click="ghSwitchTab('ci')" x-text="$t('gh.trackerCi')"></a>
              <a role="tab" class="tab" :class="ghTab === 'receiver-ci' ? 'tab-active' : ''"
                 @click="ghSwitchTab('receiver-ci')" x-text="$t('gh.receiverCi')"></a>
            </div>

                                  <span x-text="$t('gh.loadFirmware')"></span>
                                </button>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                  <template x-if="ghSelectedRun && ghRunArtifacts.length === 0 && !ghArtifactsLoading">
                    <div class="text-center text-sm opacity-50 py-3" x-text="$t('gh.noArtifacts')"></div>
                  </template>
                </div>
              </template>

              <template x-if="ghCIRuns.length === 0 && !ghLoading">
                <div class="text-center text-sm opacity-50 py-4" x-text="$t('gh.noCiBuilds')"></div>
              </template>
            </div>
          </template>

          <!-- ── Receiver CI Tab ─────────────────────────── -->
          <template x-if="ghTab === 'receiver-ci' && !ghLoading">
            <div class="space-y-3">
              <!-- Run selector -->
              <template x-if="ghReceiverCIRuns.length > 0">
                <div>
                  <select class="select select-bordered select-sm w-full"
                          :value="ghSelectedReceiverRun || ''"
                          @change="ghSelectReceiverRun(Number($event.target.value))">

                    <template x-for="run in ghReceiverCIRuns" :key="run.id">
                      <option :value="run.id"
                              x-text="'#' + run.number + ' · ' + run.sha + ' · ' + run.title.slice(0, 50) + ' · ' + formatDate(run.date)"
                              :selected="run.id === ghSelectedReceiverRun"></option>
                    </template>
                  </select>

                  <!-- Artifact loading -->
                  <div x-show="ghArtifactsLoading" class="flex items-center justify-center py-3">
                    <span class="loading loading-spinner loading-sm text-primary"></span>
                    <span class="text-sm ml-2 opacity-60" x-text="$t('gh.loadingArtifacts')"></span>
                  </div>

                  <!-- Artifact list -->
                  <template x-if="ghSelectedReceiverRun && ghReceiverRunArtifacts.length > 0 && !ghArtifactsLoading">
                    <div class="mt-2 space-y-1">
                      <div class="text-xs opacity-50 mb-1.5">
                        <span x-text="ghFilteredReceiverArtifacts.length + '/' + ghReceiverRunArtifacts.length"></span> <span x-text="$t('gh.artifactsShown')"></span>
                        <span class="text-warning ml-1" x-show="!ghProxyAvailable" x-text="'· ' + $t('gh.opensInTab')"></span>
                      </div>
                      <div class="max-h-64 overflow-y-auto space-y-1 pr-0.5">
                        <template x-for="artifact in ghFilteredReceiverArtifacts" :key="artifact.name">
                          <div class="flex items-center gap-2 rounded-lg px-3 py-1.5"
                               :class="artifact._matched ? 'bg-primary/10 border-l-3 border-primary' : 'bg-base-200'">
                            <div class="flex-1 min-w-0">
                              <div class="tooltip tooltip-bottom w-full text-left before:max-w-xs before:text-xs before:whitespace-normal" :data-tip="artifact.name">
                                <div class="truncate text-sm font-mono" x-text="artifact.name"></div>
                              </div>
                              <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-0.5">

                                <template x-if="artifact._matchedTarget">
                                  <span class="badge badge-soft badge-primary badge-xs" x-text="artifact._matchedTarget"></span>
                                </template>
                              </div>
                            </div>

                            <!-- Download state -->

                              <span class="badge badge-success badge-sm gap-1">
                                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                <span x-text="$t('gh.loaded')"></span>

                            </template>
                            <template x-if="ghDlState(artifact.name)?.fallback">

                                <span class="text-xs opacity-60" x-text="Math.round((ghDlState(artifact.name)?.progress || 0) * 100) + '%'"></span>

                            <template x-if="ghDlState(artifact.name)?.error">

                                <span class="badge badge-error badge-sm" x-text="$t('gh.error')"></span>
                                <button class="btn btn-ghost btn-xs" @click="ghDownloadArtifact(artifact)" x-text="$t('gh.retry')"></button>
                              </div>
                            </template>
                            <template x-if="!ghDlState(artifact.name)">
                              <div class="flex items-center gap-2">
                                <button class="btn btn-ghost btn-xs btn-square opacity-40 hover:opacity-100"
                                        @click="ghSaveArtifactToDisk(artifact)"
                                        :title="$t('gh.saveToDisk')">
                                  <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                </button>
                                <button class="btn btn-primary btn-sm gap-1 px-3"
                                        @click="ghDownloadArtifact(artifact)"
                                        :title="$t('gh.downloadAndLoad')">
                                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                                  <span x-text="$t('gh.loadFirmware')"></span>
                                </button>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                  <template x-if="ghSelectedReceiverRun && ghReceiverRunArtifacts.length === 0 && !ghArtifactsLoading">

                  </template>
                </div>

                <div class="text-center text-sm opacity-50 py-4" x-text="$t('gh.noReceiverCiBuilds')"></div>
              </template>
            </div>
          </template>

        </div>
      </div>

    <!-- ─── Firmware Card ──────────────────────────────────────── -->
    <div class="card bg-base-100 shadow-md" x-cloak x-show="connected">
      <div class="card-body p-4">
        <h2 class="card-title text-base mb-2">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span x-text="$t('fw.title')"></span>
          <span class="badge badge-ghost badge-sm" x-show="firmwareFiles.length > 0" x-text="firmwareFiles.length + ' ' + $t('fw.files')"></span>
        </h2>

        <!-- Drop zone -->
        <div class="border-2 border-dashed rounded-lg p-4 text-center transition-colors"
             :class="firmwareFiles.length > 0 ? 'border-success/50 bg-success/5' : 'border-base-300 hover:border-primary/50'"
             @dragover.prevent="$el.classList.add('border-primary', 'bg-primary/5')"
             @dragleave="$el.classList.remove('border-primary', 'bg-primary/5')"
             @drop.prevent="$el.classList.remove('border-primary', 'bg-primary/5'); handleDrop($event)">

          <input type="file" accept=".uf2,.hex,.zip" multiple class="hidden" x-ref="fileInput"
                 @change="selectFirmware($event)">

          <template x-if="firmwareFiles.length === 0">
            <div>
              <svg class="w-10 h-10 mx-auto mb-2 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
              <p class="text-sm opacity-60 mb-2">Drag & drop <b>.uf2</b>, <b>.hex</b>, or <b>.zip</b> firmware file(s) here</p>
              <button class="btn btn-primary btn-sm" @click="$refs.fileInput.click()" x-text="$t('fw.chooseFiles')"></button>
            </div>
          </template>

          <template x-if="firmwareFiles.length > 0">
            <div class="space-y-2">
              <!-- Firmware file list -->
              <template x-for="fw in firmwareFiles" :key="fw.id">
                <div class="flex items-center justify-between gap-2 text-left bg-base-200 rounded-lg px-3 py-2">
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2">
                      <svg class="w-4 h-4 text-success shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                      <span class="font-medium text-sm truncate" x-text="fw.file.name"></span>
                      <template x-if="fw.detectedBoard">
                        <span class="badge badge-info badge-xs font-mono shrink-0" x-text="fw.detectedBoard"></span>
                      </template>
                      <template x-if="fw.sdPlusApp">
                        <span class="badge badge-warning badge-xs shrink-0">SD+App</span>
                      </template>
                    </div>
                    <div class="flex flex-wrap gap-x-3 gap-y-0.5 text-[11px] opacity-50 mt-0.5 pl-6">
                      <span x-text="(fw.parsed.data.length / 1024).toFixed(1) + ' KB'"></span>
                      <span x-text="'Base: 0x' + fw.parsed.baseAddress.toString(16).toUpperCase().padStart(8, '0')"></span>
                      <span x-text="'CRC: 0x' + fw.parsed.crc32.toString(16).toUpperCase().padStart(8, '0')"></span>
                    </div>
                  </div>
                  <div class="flex items-center gap-0.5 shrink-0">
                    <button class="btn btn-ghost btn-xs btn-circle opacity-40 hover:opacity-100"
                            @click="saveFirmware(fw)" :title="$t('fw.saveToDisk')">
                      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    </button>
                    <button class="btn btn-ghost btn-xs btn-circle opacity-40 hover:opacity-100"
                            @click="removeFirmware(fw.id)" :title="$t('fw.remove')">
                      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                  </div>
                </div>
              </template>
              <button class="btn btn-ghost btn-xs" @click="$refs.fileInput.click()" x-text="$t('fw.addMore')"></button>
            </div>
          </template>
        </div>

        <!-- Role + board target → firmware mapping -->
        <template x-if="showMapping">
          <div class="mt-3">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-sm font-medium opacity-70" x-text="$t('fw.boardTargetMapping')"></h3>
              <span class="badge badge-xs" :class="allMapped ? 'badge-success' : 'badge-warning'"
                    x-text="allMapped ? $t('fw.allMapped') : $t('fw.unmappedTargets')"></span>
            </div>
            <div class="space-y-1.5">
              <template x-for="target in updateTargets" :key="target.key">
                <div class="bg-base-200 rounded-lg px-3 py-2 space-y-1">
                  <div class="flex items-center gap-2">
                    <span class="badge badge-xs shrink-0" :class="target.role === 'receiver' ? 'badge-warning' : 'badge-ghost'" x-text="target.role"></span>
                    <span class="text-xs font-mono shrink-0" x-text="target.boardTarget"></span>
                    <select class="select select-bordered select-xs min-w-0 flex-1"
                            :value="firmwareMapping[target.key] || ''"
                            @change="setFirmwareMapping(target, Number($event.target.value) || null)">
                      <option value="" x-text="$t('fw.selectFirmware')"></option>
                      <template x-for="fw in firmwareFiles" :key="fw.id">
                        <option :value="fw.id" x-text="fw.file.name" :selected="firmwareMapping[target.key] === fw.id"></option>
                      </template>
                    </select>
                  </div>
                  <template x-if="firmwareMapping[target.key] && mappingGuard(target).code !== 'exact'">
                    <div class="alert alert-sm py-1 px-2" :class="mappingGuard(target).level === 'error' ? 'alert-error' : 'alert-warning'">
                      <span class="text-xs" x-text="mappingMessage(target)"></span>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ─── Update Card ────────────────────────────────────────── -->
    <div class="card bg-base-100 shadow-md" x-cloak x-show="connected">
      <div class="card-body p-4">
        <h2 class="card-title text-base mb-2">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span x-text="$t('update.title')"></span>
        </h2>

        <!-- Pre-update: start button -->
        <template x-if="!updating && updateSuccess === null">
          <div class="flex flex-col items-center gap-3">
            <div class="text-sm opacity-60" x-show="selectedCount > 0 || _hasReceiverUpdate()">
              <span x-show="selectedCount > 0" x-text="selectedCount + ' ' + $t('update.trackersSelected')"></span>
              <span x-show="selectedCount > 0 && _hasReceiverUpdate()"> + </span>
              <span x-show="_hasReceiverUpdate()">receiver</span>
            </div>
            <template x-if="selectedCount > 0 && _hasReceiverUpdate()">
              <div class="alert alert-info alert-sm py-1 px-3">
                <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-xs" x-text="$t('update.trackersFirstThenReceiver')"></span>
              </div>
            </template>
            <template x-if="receiverInfo && (receiverInfo.protocolVersion === 0 || receiverInfo.bootloader === 'nrf5_opendfu') && receiverInfo.boardTarget && firmwareMapping['receiver:' + receiverInfo.boardTarget]">
              <div class="alert alert-warning alert-sm py-1 px-3">
                <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-xs" x-text="receiverInfo.bootloader === 'nrf5_opendfu'
                  ? $t('update.receiverAclBlocked')
                  : $t('update.receiverUnsupported')"></span>
              </div>
            </template>
            <div class="flex gap-2 items-center flex-wrap">
              <button class="btn btn-primary gap-2"
                      :disabled="!canUpdate"
                      @click="requestUpdate()">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                <span x-text="$t('update.startUpdate')"></span>
              </button>
              <button class="btn btn-outline btn-sm btn-ghost gap-1"
                      x-show="selectedCount > 0"
                      @click="deselectAll()">
                <span x-text="$t('tracker.deselect')"></span>
              </button>
            </div>
            <p class="text-xs opacity-40" x-show="!canUpdate && firmwareFiles.length === 0" x-text="$t('update.selectFirmwareFirst')"></p>
            <p class="text-xs opacity-40" x-show="!canUpdate && firmwareFiles.length > 0 && selectedCount === 0 && !_hasReceiverUpdate()" x-text="$t('update.selectTrackersOrReceiver')"></p>
            <p class="text-xs opacity-40" x-show="!canUpdate && firmwareFiles.length > 0 && selectedCount > 0 && !allMapped" x-text="$t('update.mapAllTargets')"></p>
          </div>
        </template>

        <!-- Final host-side OTA confirmation -->
        <template x-if="updateConfirmation">
          <div class="modal modal-open">
            <div class="modal-box max-w-2xl">
              <h3 class="font-bold text-lg" x-text="$t('update.confirmTitle')"></h3>
              <div class="alert alert-warning mt-3">
                <span class="text-sm" x-text="$t('update.confirmWarning')"></span>
              </div>
              <div class="space-y-2 mt-3">
                <template x-for="item in updateConfirmation.items" :key="item.key">
                  <div class="bg-base-200 rounded-lg px-3 py-2 text-sm">
                    <div class="font-mono" x-text="item.role + ':' + item.boardTarget"></div>
                    <div class="truncate" x-text="item.firmware.file.name"></div>
                    <div class="text-xs mt-1" :class="item.level === 'warning' ? 'text-warning' : 'text-success'" x-text="item.message"></div>
                  </div>
                </template>
              </div>
              <div class="modal-action">
                <button class="btn" @click="cancelUpdateConfirmation()" x-text="$t('update.cancel')"></button>
                <button class="btn btn-warning" @click="confirmUpdate()" x-text="$t('update.confirmFlash')"></button>
              </div>
            </div>
            <div class="modal-backdrop" @click="cancelUpdateConfirmation()"></div>
          </div>
        </template>

        <!-- During update: progress -->
        <template x-if="updating">
          <div class="space-y-4">
            <!-- Step indicator -->
            <ul class="steps steps-horizontal w-full text-xs">
              <li class="step" :class="updateStep >= 1 ? 'step-primary' : ''">BEGIN</li>
              <li class="step" :class="updateStep >= 2 ? 'step-primary' : ''">UPLOAD</li>
              <li class="step" :class="updateStep >= 3 ? 'step-primary' : ''">VERIFY</li>
              <li class="step" :class="updateStep >= 4 ? 'step-primary' : ''">ACTIVATE</li>
            </ul>

            <!-- Batch info -->
            <div class="text-center text-sm" x-show="batchInfo.total > 1">
              <span class="badge badge-outline badge-sm">
                <span x-text="$t('update.batch')"></span> <span x-text="batchInfo.current"></span>/<span x-text="batchInfo.total"></span>
                — <span x-text="$t('tracker.title')"></span> <span x-text="batchInfo.trackerIds?.join(', ')"></span>
              </span>
            </div>

            <!-- Progress bar (during streaming phase) -->
            <div x-show="updatePhase === 'stream'">
              <div class="flex justify-between text-xs mb-1 opacity-60">
                <span x-text="progressPercent + '%'"></span>
                <span x-text="progress.speed?.toFixed(1) + ' KB/s'"></span>
                <span x-text="progressKB + ' / ' + totalKB + ' KB'"></span>
              </div>
              <progress class="progress progress-primary w-full h-3"
                        :value="progress.consumed"
                        :max="progress.total"></progress>
            </div>

            <!-- Phase indicator (non-streaming phases) -->
            <div class="flex items-center justify-center gap-2 py-2" x-show="updatePhase !== 'stream'">
              <span class="loading loading-spinner loading-sm text-primary"></span>
              <span class="text-sm capitalize" x-text="updatePhase + '…'"></span>
            </div>

            <!-- Abort button -->
            <div class="text-center">
              <button class="btn btn-error btn-sm btn-outline" @click="abortUpdate()" x-text="$t('update.abortUpdate')">
              </button>
            </div>
          </div>
        </template>

        <!-- Post-update: result -->
        <template x-if="!updating && updateSuccess !== null">
          <div class="text-center space-y-3">
            <template x-if="updateSuccess">
              <div class="flex flex-col items-center gap-2"
                   x-data="{ countdown: 8 }"
                   x-init="let t = setInterval(() => { countdown--; if (countdown <= 0) clearInterval(t); }, 1000)">
                <svg class="w-12 h-12 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <p class="text-lg font-semibold text-success" x-text="$t('update.updateSuccessful')"></p>
                <p class="text-sm opacity-60" x-text="$t('update.allUpdated')"></p>
                <p class="text-xs opacity-40" x-text="$t('update.autoDismiss', { seconds: Math.max(countdown, 0) })"></p>
              </div>
            </template>
            <template x-if="!updateSuccess">
              <div class="flex flex-col items-center gap-2">
                <svg class="w-12 h-12 text-error" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <p class="text-lg font-semibold text-error" x-text="$t('update.updateFailed')"></p>
                <p class="text-sm opacity-60" x-text="$t('update.checkLog')"></p>
              </div>
            </template>
            <div class="flex gap-2 justify-center">
              <button class="btn btn-primary btn-sm" @click="updateSuccess = null; scan()" x-text="$t('update.scanAgain')">
              </button>
              <button class="btn btn-ghost btn-sm" @click="updateSuccess = null" x-text="$t('update.dismiss')">
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ─── Serial DFU Card ──────────────────────────────────────── -->
    <div id="serial-dfu-section" class="card bg-base-100 shadow-md" x-data="serialDfuApp">
      <div class="card-body p-4">
        <div class="flex items-center justify-between">
          <h2 class="card-title text-base">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <span x-text="$t('dfu.title')"></span>
            <span class="badge badge-outline badge-xs" x-text="$t('dfu.usb')"></span>
          </h2>
          <template x-if="!webSerialSupported">
            <span class="badge badge-warning badge-sm" x-text="$t('dfu.webSerialNotSupported')"></span>
          </template>
        </div>
        <p class="text-xs opacity-60 -mt-1" x-html="$t('dfu.description', { cmd: '<code class=\'kbd kbd-xs\'>dfu</code>' })"></p>

        <!-- Not supported alert -->
        <template x-if="!webSerialSupported">
          <div class="alert alert-warning alert-sm mt-2">
            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span class="text-xs" x-text="$t('dfu.webSerialRequires')"></span>
          </div>
        </template>

        <!-- Main UI (when supported) -->
        <template x-if="webSerialSupported">
          <div class="space-y-3 mt-1">

            <!-- Protocol & firmware selection -->
            <div class="flex flex-wrap gap-2 items-end">
              <!-- Protocol select -->
              <div class="form-control">
                <label class="label py-0"><span class="label-text text-xs" x-text="$t('dfu.protocol')"></span></label>
                <select class="select select-bordered select-sm w-40"
                        x-model="dfuProtocol"
                        :disabled="dfuState !== 'idle'">
                  <option value="auto" x-text="$t('dfu.autoDetect')"></option>
                  <option value="adafruit" x-text="$t('dfu.adafruit')"></option>
                  <option value="nordic" x-text="$t('dfu.nordic')"></option>
                </select>
              </div>

              <!-- Firmware file picker -->
              <div class="form-control flex-1 min-w-[200px]">
                <label class="label py-0"><span class="label-text text-xs" x-text="$t('dfu.firmwareLabel')"></span></label>
                <input type="file" class="file-input file-input-bordered file-input-sm w-full"
                       accept=".zip,.uf2,.hex,.bin"
                       @change="dfuSelectFile($event)"
                       :disabled="dfuState !== 'idle'">
              </div>
            </div>

            <!-- Shared firmware from main OTA app -->
            <template x-if="sharedFirmwareFiles.length > 0 && dfuState === 'idle'">
              <div class="bg-base-200 rounded-lg px-3 py-2 space-y-1">
                <div class="text-xs font-medium opacity-60" x-text="$t('dfu.orUseLoaded')"></div>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="fw in sharedFirmwareFiles" :key="fw.id">
                    <button class="btn btn-xs gap-1"
                            :class="dfuFile && dfuFileSource === 'loaded' && dfuFile.name === fw.name ? 'btn-primary' : 'btn-ghost'"
                            @click="dfuUseSharedFirmware(fw)">
                      <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                      <span class="truncate max-w-[180px]" x-text="fw.name"></span>
                      <span class="opacity-50" x-text="(fw.size / 1024).toFixed(0) + 'KB'"></span>
                    </button>
                  </template>
                </div>
              </div>
            </template>

            <!-- Selected firmware info -->
            <template x-if="dfuFile">
              <div class="bg-base-200 rounded-lg px-3 py-2 flex items-center gap-2">
                <svg class="w-4 h-4 opacity-50 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span class="text-sm font-mono truncate" x-text="dfuFile.name"></span>
                <span class="badge badge-ghost badge-xs" x-text="(dfuFile.size / 1024).toFixed(1) + ' KB'"></span>
                <span class="badge badge-outline badge-xs uppercase" x-text="dfuFileFormat"></span>
                <template x-if="dfuFileSource === 'loaded'">
                  <span class="badge badge-info badge-xs" x-text="$t('dfu.fromOta')"></span>
                </template>
                <template x-if="dfuState === 'idle'">
                  <button class="btn btn-ghost btn-xs btn-circle ml-auto opacity-40 hover:opacity-100"
                          @click="dfuClearFile()" :title="$t('dfu.clear')">
                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                  </button>
                </template>
              </div>
            </template>

            <!-- Web Serial cannot read a SlimeNRF board target. First confirmation: enter it. -->
            <template x-if="dfuFile && dfuState === 'idle'">
              <div class="rounded-lg border border-warning/50 bg-warning/15 p-3 text-base-content">
                <div class="w-full space-y-3">
                  <div class="text-sm font-semibold text-base-content" x-text="$t('dfu.modelRequired')"></div>
                  <div class="text-xs leading-relaxed text-base-content/80" x-text="$t('dfu.modelRequiredDetail')"></div>
                  <label class="form-control w-full gap-1.5">
                    <span class="label-text text-xs font-medium text-base-content/90" x-text="$t('dfu.expectedTarget')"></span>
                    <div class="flex flex-col gap-2 sm:flex-row">
                      <select class="select select-bordered select-sm w-full bg-base-100 text-base-content sm:w-36" x-model="dfuExpectedRole">
                        <option value="" x-text="$t('dfu.selectRole')"></option>
                        <option value="tracker" x-text="$t('gh.tracker')"></option>
                        <option value="receiver" x-text="$t('gh.receiver')"></option>
                      </select>
                      <input class="input input-bordered input-sm min-w-0 flex-1 bg-base-100 font-mono text-base-content placeholder:text-base-content/50" type="text"
                             x-model="dfuExpectedTarget" :placeholder="$t('dfu.expectedTargetPlaceholder')">
                    </div>
                  </label>
                  <template x-if="dfuExpectedRole && dfuExpectedTarget.trim()">
                    <div class="rounded-md px-2 py-1 text-xs font-medium"
                         :class="dfuTargetGuard.level === 'error' ? 'bg-error text-error-content' : (dfuTargetGuard.level === 'warning' ? 'bg-warning text-warning-content' : 'bg-success text-success-content')"
                         x-text="dfuTargetGuardMessage"></div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Action buttons -->
            <div class="mt-2 flex gap-2 items-center">
              <template x-if="dfuState === 'idle'">
                <button class="btn btn-primary btn-sm gap-2"
                        :disabled="!dfuFile || dfuTargetGuard.level === 'error'"
                        @click="dfuStart()">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                  <span x-text="$t('dfu.flashViaSerial')"></span>
                </button>
              </template>
              <template x-if="dfuState === 'running'">
                <button class="btn btn-error btn-sm btn-outline gap-2" @click="dfuAbort()">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                  <span x-text="$t('dfu.abort')"></span>
                </button>
              </template>
            </div>

            <!-- Second confirmation after selecting the serial port/protocol, before flash. -->
            <template x-if="dfuConfirmation">
              <div class="modal modal-open">
                <div class="modal-box max-w-xl">
                  <h3 class="font-bold text-lg" x-text="$t('dfu.confirmTitle')"></h3>
                  <div class="alert alert-error mt-3"><span class="text-sm" x-text="$t('dfu.confirmWarning')"></span></div>
                  <dl class="grid grid-cols-[auto_1fr] gap-x-3 gap-y-1 text-sm mt-3">
                    <dt class="opacity-60" x-text="$t('dfu.firmware')"></dt><dd class="font-mono break-all" x-text="dfuConfirmation.firmwareName"></dd>
                    <dt class="opacity-60" x-text="$t('dfu.firmwareTarget')"></dt><dd class="font-mono" x-text="dfuConfirmation.firmwareTarget || $t('dfu.unknownTarget')"></dd>
                    <dt class="opacity-60" x-text="$t('dfu.protocol')"></dt><dd x-text="dfuConfirmation.protocol"></dd>
                    <dt class="opacity-60">USB VID:PID</dt><dd class="font-mono" x-text="(dfuConfirmation.usbVendorId ?? 0).toString(16).padStart(4, '0') + ':' + (dfuConfirmation.usbProductId ?? 0).toString(16).padStart(4, '0')"></dd>
                  </dl>
                  <label class="form-control mt-3">
                    <span class="label-text text-xs" x-text="$t('dfu.typeTargetAgain', { target: dfuConfirmation.expectedIdentity })"></span>
                    <input class="input input-bordered font-mono" type="text" x-model="dfuModelConfirmation" autocomplete="off">
                  </label>
                  <div class="modal-action">
                    <button class="btn" @click="cancelDfuConfirmation()" x-text="$t('update.cancel')"></button>
                    <button class="btn btn-error" :disabled="dfuModelConfirmation.trim() !== dfuConfirmation.expectedIdentity" @click="approveDfuConfirmation()" x-text="$t('dfu.confirmFlash')"></button>
                  </div>
                </div>
                <div class="modal-backdrop" @click="cancelDfuConfirmation()"></div>
              </div>
            </template>

            <!-- Progress -->
            <template x-if="dfuState === 'running'">
              <div class="space-y-2">
                <div class="flex items-center gap-2">
                  <progress class="progress progress-primary flex-1" :value="dfuProgress" max="100"></progress>
                  <span class="text-sm font-mono w-10 text-right" x-text="dfuProgress + '%'"></span>
                </div>
                <div class="flex items-center gap-2 text-xs opacity-60">
                  <span class="loading loading-spinner loading-xs"></span>
                  <span x-text="dfuPhaseText"></span>
                </div>
              </div>
            </template>

            <!-- Result -->
            <template x-if="dfuState === 'done'">
              <div class="alert" :class="dfuSuccess ? 'alert-success' : 'alert-error'">
                <svg x-show="dfuSuccess" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <svg x-show="!dfuSuccess" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <div>
                  <p class="text-sm font-semibold" x-text="dfuSuccess ? $t('dfu.dfuComplete') : $t('dfu.dfuFailed')"></p>
                  <p class="text-xs opacity-70" x-text="dfuResultMsg"></p>
                </div>
                <button class="btn btn-sm btn-ghost" @click="dfuReset()" x-text="$t('update.dismiss')"></button>
              </div>
            </template>

            <!-- DFU Log (collapsible) -->
            <template x-if="dfuLogs.length > 0">
              <div class="collapse collapse-arrow bg-base-200 rounded-lg">
                <input type="checkbox" x-model="dfuLogExpanded">
                <div class="collapse-title text-xs font-medium py-2 min-h-0">
                  <span x-text="$t('dfu.dfuLog')"></span>
                  <span class="badge badge-ghost badge-xs ml-1" x-text="dfuLogs.length"></span>
                </div>
                <div class="collapse-content">
                  <div class="max-h-48 overflow-y-auto">
                    <template x-for="(line, i) in dfuLogs" :key="i">
                      <div class="text-xs py-0.5 font-mono opacity-70" x-text="line"></div>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>

    <!-- ─── Log Panel ──────────────────────────────────────────── -->
    <div class="card bg-base-100 shadow-md" x-cloak x-show="logs.length > 0">
      <div class="card-body p-0">
        <button class="flex items-center justify-between w-full p-4 hover:bg-base-200/50 transition-colors"
                @click="logExpanded = !logExpanded">
          <h2 class="card-title text-base">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span x-text="$t('log.title')"></span>
            <span class="badge badge-ghost badge-sm" x-text="logs.length + ' ' + $t('log.entries')"></span>
          </h2>
          <svg class="w-4 h-4 transition-transform" :class="logExpanded ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>

        <div x-show="logExpanded" x-transition>
          <div id="log-container" class="max-h-64 overflow-y-auto px-4 pb-4">
            <template x-for="(entry, i) in logs" :key="i">
              <div class="log-line text-xs py-0.5 flex gap-2">
                <span class="opacity-30 select-none whitespace-nowrap" x-text="entry.time"></span>
                <span class="whitespace-pre-wrap break-all" x-text="entry.msg"></span>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- ═══════════════════════════════════════════════════════════════
