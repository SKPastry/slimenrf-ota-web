[package]
name = "slimenrf-ota"
version = "0.1.0"
description = "SlimeNRF OTA Firmware Update Tool"
authors = ["jitingcn"]
license = "MIT"
repository = "https://github.com/jitingcn/slimevr-tracker-nrf"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
hidapi = "2"
serialport = "4"
parking_lot = "0.12"
tauri-plugin-http = "2.5.9"
